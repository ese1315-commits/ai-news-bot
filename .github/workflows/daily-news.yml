name: Daily AI News Digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  news-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Create Python script
        run: |
          cat <<'PYEOF' > /tmp/news_digest.py
          import os, smtplib, json, urllib.request, feedparser
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          SOURCES = [
              # ── 종합 뉴스 ──
              "https://www.yna.co.kr/rss/topnews.xml",
              "https://www.hani.co.kr/rss/",
              "https://news.kbs.co.kr/rss/rss5g.xml",
              "https://www.chosun.com/rss/",
              "https://www.joongang.co.kr/rss/",
              "https://www.khan.co.kr/rss/",
              # ── 경제 뉴스 ──
              "https://www.mt.co.kr/rss/",
              "https://www.fnnews.com/rss/",
              "https://www.etnews.com/rss/",
              # ── IT/테크 뉴스 ──
              "https://zdnet.co.kr/rss/",
              "https://it.donga.com/feed/",
              "https://www.bloter.net/rss/",
              # ── 방송 뉴스 ──
              "https://imnews.imbc.com/rss/",
              "https://www.ytn.co.kr/rss/",
          ]
          items = []
          for url in SOURCES:
              try:
                  feed = feedparser.parse(url)
                  for entry in feed.entries[:3]:
                      items.append(f"- {entry.get('title','')}: {entry.get('link','')}")
              except Exception as e:
                  print(f"RSS 실패: {url} - {e}")

          news_text = "\n".join(items[:20]) if items else "뉴스를 가져오지 못했습니다."

          lang = os.environ.get("AI_RESPONSE_LANGUAGE", "ko")
          prompt = f"""다음 한국 뉴스들을 {lang}로 요약해서 HTML 형식으로 만들어줘.
          핵심 10가지를 짧고 명확하게 정리하고, 각 항목에 제목과 링크를 남겨줘.
          뉴스:
          {news_text}"""

          data = json.dumps({
              "model": "deepseek-chat",
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {os.environ['DEEPSEEK_API_KEY']}"
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode())
              summary_html = result["choices"][0]["message"]["content"]
          except Exception as e:
              summary_html = f"<p>요약 실패: {e}</p><pre>{news_text}</pre>"

          msg = MIMEMultipart()
          msg["From"] = os.environ["GMAIL_ADDRESS"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg["Subject"] = "📰 오늘의 국내 뉴스 요약"
          msg.attach(MIMEText(summary_html, "html"))

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(os.environ["GMAIL_ADDRESS"], os.environ["GMAIL_APP_PASSWORD"])
              server.send_message(msg)

          print("✅ 이메일 전송 완료!")
          PYEOF

      - name: Run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AI_RESPONSE_LANGUAGE: ${{ secrets.AI_RESPONSE_LANGUAGE }}
        run: python /tmp/news_digest.py

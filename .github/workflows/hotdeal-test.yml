name: Hot Deal Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test hotdeal sites
        run: |
          cat <<'PYEOF' > /tmp/test_hotdeal.py
          import urllib.request, re

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Accept-Language": "ko-KR,ko;q=0.9,en;q=0.8",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          def test(url, name):
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = resp.read().decode("utf-8", "ignore")
                      status = resp.status
                  print(f"✅ {name}: HTTP {status}, 길이 {len(data)} bytes")
                  return data
              except Exception as e:
                  print(f"❌ {name}: 실패 - {e}")
                  return None

          print("=" * 50)
          print("핫딜 사이트 접근 테스트")
          print("=" * 50)

          # 1. 뽐뿌 - RSS 시도
          data = test("https://www.ppomppu.co.kr/rss.php?page=2", "뽐뿌 RSS")

          # 2. 알구몬 - HTML 직접
          data = test("https://www.algumon.com/n/deal", "알구몬 HTML")

          # 3. 어미새 - HTML 직접
          data = test("https://eomisae.co.kr", "어미새 HTML")
          if data and "Deal" in data:
              print("  → 어미새: 핫딜 게시판 요소 발견")
          elif data:
              print(f"  → 어미새: 페이지 로드됨 ({len(data)} bytes), 구조 파악 필요")

          print("=" * 50)
          print("테스트 완료!")
          PYEOF
          python /tmp/test_hotdeal.py
